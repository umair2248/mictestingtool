<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">How to clean the AirPods microphone: dry cotton swab and soft brush on the bottom mesh, no pins, water or compressed air</title>
  <defs><linearGradient id="pod" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6e8ec"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd3da"/></linearGradient></defs>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0f1b2e"/>
    <text x="600" y="58" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">Cleaning the AirPods mic</text>

    <rect x="250" y="110" width="110" height="420" rx="55" fill="url(#pod)"/>
    <ellipse cx="305" cy="520" rx="34" ry="12" fill="#6b6f77"/>
    <g fill="#9a8a5a" opacity="0.85"><circle cx="292" cy="518" r="4"/><circle cx="312" cy="522" r="3"/><circle cx="322" cy="516" r="3"/></g>
    <rect x="370" y="556" width="150" height="8" rx="4" fill="#f2e6d0" transform="rotate(-25 370 560)"/>
    <ellipse cx="360" cy="560" rx="22" ry="12" fill="#ffffff" transform="rotate(-25 360 560)"/>
    <text x="305" y="610" fill="#b8c8de" font-size="18" text-anchor="middle">Grey or shiny mesh = dirty</text>

    <rect x="520" y="110" width="580" height="220" rx="18" fill="#132e27" stroke="#2ec27e" stroke-width="2"/>
    <text x="550" y="156" fill="#2ec27e" font-size="24" font-weight="700">Do</text>
    <text x="550" y="196" fill="#ffffff" font-size="19">✓  Dry cotton swab on the outside of the mesh</text>
    <text x="550" y="232" fill="#ffffff" font-size="19">✓  Soft, dry brush to lift out fluff</text>
    <text x="550" y="268" fill="#ffffff" font-size="19">✓  Clean both AirPods, then test each side</text>
    <text x="550" y="304" fill="#b8c8de" font-size="16">Sticky wax: swab barely damp with alcohol, outside only</text>

    <rect x="520" y="360" width="580" height="200" rx="18" fill="#2e1616" stroke="#ef5b5b" stroke-width="2"/>
    <text x="550" y="406" fill="#ef5b5b" font-size="24" font-weight="700">Don't</text>
    <text x="550" y="446" fill="#ffffff" font-size="19">✗  Pins, needles or toothpicks in the holes</text>
    <text x="550" y="482" fill="#ffffff" font-size="19">✗  Running water or soaking</text>
    <text x="550" y="518" fill="#ffffff" font-size="19">✗  Compressed air (pushes dirt further in)</text>
    <text x="600" y="648" fill="#8b99ad" font-size="16" text-anchor="middle">Let everything dry fully before the AirPods go back in the case.</text>
  </g>
</svg>
