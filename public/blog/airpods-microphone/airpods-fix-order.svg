<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">AirPods mic not working: fixes in order, from cleaning the stem and checking the Microphone setting, to charging, reconnecting, Mic Mode, firmware and a full reset</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0f1b2e"/>
    <text x="600" y="58" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">AirPods mic not working? Go in this order</text>
    <text x="600" y="92" fill="#8b99ad" font-size="17" text-anchor="middle">Quickest and most common at the top. Test again after each step.</text>
    <g font-size="21">
      <rect x="100" y="120" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="128" y="164" fill="#2ec27e" font-weight="700">1</text><text x="160" y="164" fill="#ffffff" font-weight="700">Clean the bottom mesh</text>
      <text x="160" y="196" fill="#b8c8de" font-size="16">Dry swab, soft brush. Both AirPods.</text>

      <rect x="620" y="120" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="648" y="164" fill="#2ec27e" font-weight="700">2</text><text x="680" y="164" fill="#ffffff" font-weight="700">Microphone setting</text>
      <text x="680" y="196" fill="#b8c8de" font-size="16">Switch AirPods Automatically</text>

      <rect x="100" y="244" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="128" y="288" fill="#2ec27e" font-weight="700">3</text><text x="160" y="288" fill="#ffffff" font-weight="700">Charge both AirPods</text>
      <text x="160" y="320" fill="#b8c8de" font-size="16">A nearly flat AirPod loses the mic first</text>

      <rect x="620" y="244" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="648" y="288" fill="#f5c542" font-weight="700">4</text><text x="680" y="288" fill="#ffffff" font-weight="700">Right device, right app mic</text>
      <text x="680" y="320" fill="#b8c8de" font-size="16">AirPods may have jumped to your Mac</text>

      <rect x="100" y="368" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="128" y="412" fill="#f5c542" font-weight="700">5</text><text x="160" y="412" fill="#ffffff" font-weight="700">Back in the case, 15 seconds</text>
      <text x="160" y="444" fill="#b8c8de" font-size="16">Then Bluetooth off and on</text>

      <rect x="620" y="368" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="648" y="412" fill="#f5c542" font-weight="700">6</text><text x="680" y="412" fill="#ffffff" font-weight="700">Mic Mode: Standard</text>
      <text x="680" y="444" fill="#b8c8de" font-size="16">Voice Isolation can clip quiet speech</text>

      <rect x="100" y="492" width="480" height="104" rx="14" fill="#16263f" stroke="#f5a65b" stroke-width="2"/>
      <text x="128" y="536" fill="#f5a65b" font-weight="700">7</text><text x="160" y="536" fill="#ffffff" font-weight="700">Update firmware and iOS</text>
      <text x="160" y="568" fill="#b8c8de" font-size="16">In the case, charging, near your iPhone</text>

      <rect x="620" y="492" width="480" height="104" rx="14" fill="#16263f" stroke="#f5a65b" stroke-width="2"/>
      <text x="648" y="536" fill="#f5a65b" font-weight="700">8</text><text x="680" y="536" fill="#ffffff" font-weight="700">Forget and reset</text>
      <text x="680" y="568" fill="#b8c8de" font-size="16">Hold the case button about 15 seconds</text>
    </g>
    <text x="600" y="640" fill="#8b99ad" font-size="16" text-anchor="middle">One side still silent after all this? That AirPod's mic is likely damaged and can be replaced on its own.</text>
  </g>
</svg>
