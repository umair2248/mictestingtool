<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">AirPods Microphone setting on iPhone: Switch AirPods Automatically, Always Left AirPod and Always Right AirPod</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0f1b2e"/>
    <text x="600" y="58" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">Test one AirPod at a time</text>

    <rect x="120" y="100" width="300" height="540" rx="44" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="6"/>
    <rect x="134" y="114" width="272" height="512" rx="32" fill="#f2f2f7"/>
    <rect x="226" y="126" width="88" height="24" rx="12" fill="#1c1c1e"/>
    <text x="160" y="196" fill="#007aff" font-size="17">&lt; AirPods Pro</text>
    <text x="160" y="240" fill="#1c1c1e" font-size="26" font-weight="700">Microphone</text>
    <rect x="152" y="262" width="236" height="150" rx="12" fill="#ffffff"/>
    <text x="168" y="296" fill="#1c1c1e" font-size="15">Switch AirPods Automatically</text>
    <line x1="168" y1="312" x2="388" y2="312" stroke="#e5e5ea"/>
    <text x="168" y="344" fill="#1c1c1e" font-size="15">Always Left AirPod</text>
    <text x="364" y="345" fill="#007aff" font-size="18" font-weight="700">✓</text>
    <line x1="168" y1="362" x2="388" y2="362" stroke="#e5e5ea"/>
    <text x="168" y="394" fill="#1c1c1e" font-size="15">Always Right AirPod</text>
    <text x="160" y="446" fill="#8e8e93" font-size="13">The microphone stays on the</text>
    <text x="160" y="464" fill="#8e8e93" font-size="13">left AirPod, even when it's</text>
    <text x="160" y="482" fill="#8e8e93" font-size="13">back in the case.</text>

    <rect x="500" y="120" width="600" height="110" rx="16" fill="#16263f" stroke="#4cc9f0" stroke-width="2"/>
    <text x="530" y="164" fill="#4cc9f0" font-size="30" font-weight="700">1</text>
    <text x="570" y="162" fill="#ffffff" font-size="21" font-weight="700">Settings &gt; your AirPods &gt; Microphone</text>
    <text x="570" y="196" fill="#b8c8de" font-size="17">Older iOS: Settings &gt; Bluetooth &gt; (i)</text>

    <rect x="500" y="250" width="600" height="110" rx="16" fill="#16263f" stroke="#4cc9f0" stroke-width="2"/>
    <text x="530" y="294" fill="#4cc9f0" font-size="30" font-weight="700">2</text>
    <text x="570" y="292" fill="#ffffff" font-size="21" font-weight="700">Always Left, then record a voice memo</text>
    <text x="570" y="326" fill="#b8c8de" font-size="17">Or run the online mic test and watch the bar</text>

    <rect x="500" y="380" width="600" height="110" rx="16" fill="#16263f" stroke="#4cc9f0" stroke-width="2"/>
    <text x="530" y="424" fill="#4cc9f0" font-size="30" font-weight="700">3</text>
    <text x="570" y="422" fill="#ffffff" font-size="21" font-weight="700">Always Right, then test again</text>
    <text x="570" y="456" fill="#b8c8de" font-size="17">The muffled one is the AirPod to clean</text>

    <rect x="500" y="510" width="600" height="110" rx="16" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
    <text x="530" y="554" fill="#2ec27e" font-size="30" font-weight="700">4</text>
    <text x="570" y="552" fill="#ffffff" font-size="21" font-weight="700">Set it back to Automatically</text>
    <text x="570" y="586" fill="#b8c8de" font-size="17">Or wearing only the other one means no mic</text>
  </g>
</svg>
