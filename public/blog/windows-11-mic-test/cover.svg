<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">How to test your mic on Windows 11: microphone with a live input level meter beside a sound settings window</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#14224a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8db4ff"/>
      <stop offset="1" stop-color="#3a6fe0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
    <text x="72" y="118" fill="#8db4ff" font-size="26" font-weight="600" letter-spacing="3">WINDOWS 11 GUIDE</text>
    <text x="72" y="196" fill="#ffffff" font-size="64" font-weight="700">How to Test</text>
    <text x="72" y="270" fill="#ffffff" font-size="64" font-weight="700">Your Mic on</text>
    <text x="72" y="344" fill="#ffffff" font-size="64" font-weight="700">Windows 11</text>
    <text x="72" y="410" fill="#b8c4e0" font-size="26">Start test · Listen to this device</text>
    <text x="72" y="448" fill="#b8c4e0" font-size="26">Sensitivity · Privacy · AirPods 4</text>
    <rect x="72" y="500" width="300" height="60" rx="30" fill="#4f8cff"/>
    <text x="222" y="539" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">mictestingtool.com</text>

    <!-- Settings card -->
    <rect x="690" y="120" width="440" height="390" rx="22" fill="#f3f5fa"/>
    <rect x="690" y="120" width="440" height="46" rx="22" fill="#e4e8f2"/>
    <rect x="690" y="144" width="440" height="22" fill="#e4e8f2"/>
    <circle cx="1060" cy="143" r="6" fill="#9aa4bb"/><circle cx="1082" cy="143" r="6" fill="#9aa4bb"/><circle cx="1104" cy="143" r="6" fill="#9aa4bb"/>
    <text x="716" y="150" fill="#2b3245" font-size="18" font-weight="600">Sound › Input</text>
    <text x="716" y="208" fill="#2b3245" font-size="18" font-weight="600">Microphone test</text>
    <rect x="716" y="226" width="388" height="16" rx="8" fill="#d6dbe8"/>
    <rect x="716" y="226" width="250" height="16" rx="8" fill="#4f8cff"/>
    <text x="716" y="272" fill="#5b6478" font-size="16">Results: 64% of total volume</text>
    <rect x="716" y="292" width="130" height="40" rx="8" fill="#4f8cff"/>
    <text x="781" y="318" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle">Start test</text>
    <text x="716" y="376" fill="#2b3245" font-size="18" font-weight="600">Input volume</text>
    <rect x="716" y="396" width="388" height="6" rx="3" fill="#d6dbe8"/>
    <rect x="716" y="396" width="300" height="6" rx="3" fill="#4f8cff"/>
    <circle cx="1016" cy="399" r="12" fill="#ffffff" stroke="#4f8cff" stroke-width="5"/>
    <text x="1104" y="440" fill="#5b6478" font-size="16" text-anchor="end">78</text>
    <!-- level bars -->
    <g fill="#4f8cff">
      <rect x="716" y="462" width="14" height="22" rx="3" opacity="0.5"/>
      <rect x="736" y="452" width="14" height="32" rx="3" opacity="0.7"/>
      <rect x="756" y="444" width="14" height="40" rx="3"/>
      <rect x="776" y="456" width="14" height="28" rx="3" opacity="0.8"/>
      <rect x="796" y="448" width="14" height="36" rx="3"/>
      <rect x="816" y="462" width="14" height="22" rx="3" opacity="0.6"/>
      <rect x="836" y="470" width="14" height="14" rx="3" opacity="0.4"/>
    </g>
  </g>
  <!-- Mic -->
  <g transform="translate(560 300)">
    <rect x="-46" y="-120" width="92" height="160" rx="46" fill="url(#mic)"/>
    <g stroke="#0b1020" stroke-opacity="0.35" stroke-width="4">
      <line x1="-26" y1="-80" x2="26" y2="-80"/><line x1="-26" y1="-56" x2="26" y2="-56"/><line x1="-26" y1="-32" x2="26" y2="-32"/>
    </g>
    <path d="M-76 0 a76 76 0 0 0 152 0" fill="none" stroke="#8db4ff" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" y1="76" x2="0" y2="120" stroke="#8db4ff" stroke-width="10" stroke-linecap="round"/>
    <line x1="-44" y1="122" x2="44" y2="122" stroke="#8db4ff" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
