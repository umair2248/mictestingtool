<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Windows 11 Settings, System, Sound, microphone properties with the Start test button and input volume slider</title>
  <rect width="1200" height="675" fill="#0f172e"/>
  <g font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
    <rect x="60" y="40" width="1080" height="595" rx="18" fill="#f3f5fa"/>
    <rect x="60" y="40" width="1080" height="52" rx="18" fill="#e4e8f2"/>
    <rect x="60" y="70" width="1080" height="22" fill="#e4e8f2"/>
    <text x="90" y="74" fill="#2b3245" font-size="18">Settings</text>
    <!-- sidebar -->
    <rect x="60" y="92" width="240" height="543" fill="#eaedf5"/>
    <g font-size="17" fill="#3c4458">
      <text x="88" y="140">Home</text>
      <rect x="76" y="160" width="208" height="38" rx="8" fill="#dbe4fb"/>
      <rect x="76" y="168" width="4" height="22" rx="2" fill="#4f8cff"/>
      <text x="88" y="185" font-weight="600" fill="#1d2433">System</text>
      <text x="88" y="230">Bluetooth &amp; devices</text>
      <text x="88" y="275">Personalization</text>
      <text x="88" y="320">Apps</text>
      <text x="88" y="365">Privacy &amp; security</text>
      <text x="88" y="410">Windows Update</text>
    </g>
    <!-- main -->
    <text x="340" y="148" fill="#1d2433" font-size="30" font-weight="600">System  ›  Sound  ›  Properties</text>
    <rect x="340" y="176" width="760" height="70" rx="10" fill="#ffffff"/>
    <circle cx="380" cy="211" r="18" fill="#dbe4fb"/>
    <rect x="374" y="198" width="12" height="20" rx="6" fill="#4f8cff"/>
    <text x="414" y="206" fill="#1d2433" font-size="18" font-weight="600">Microphone</text>
    <text x="414" y="230" fill="#5b6478" font-size="15">USB Audio Device</text>
    <text x="340" y="290" fill="#1d2433" font-size="20" font-weight="600">Input settings</text>
    <!-- input volume -->
    <rect x="340" y="306" width="760" height="78" rx="10" fill="#ffffff"/>
    <text x="364" y="352" fill="#1d2433" font-size="17">Input volume</text>
    <rect x="700" y="342" width="330" height="6" rx="3" fill="#d6dbe8"/>
    <rect x="700" y="342" width="250" height="6" rx="3" fill="#4f8cff"/>
    <circle cx="950" cy="345" r="12" fill="#ffffff" stroke="#4f8cff" stroke-width="5"/>
    <text x="1078" y="352" fill="#3c4458" font-size="17" text-anchor="end">75</text>
    <!-- test -->
    <rect x="340" y="394" width="760" height="120" rx="10" fill="#ffffff" stroke="#4f8cff" stroke-width="3"/>
    <text x="364" y="432" fill="#1d2433" font-size="17">Test your microphone</text>
    <text x="364" y="458" fill="#5b6478" font-size="15">Results: 68% of total volume</text>
    <g fill="#4f8cff">
      <rect x="364" y="478" width="10" height="18" rx="2" opacity="0.5"/><rect x="380" y="470" width="10" height="26" rx="2" opacity="0.7"/>
      <rect x="396" y="464" width="10" height="32" rx="2"/><rect x="412" y="474" width="10" height="22" rx="2" opacity="0.8"/>
      <rect x="428" y="468" width="10" height="28" rx="2"/><rect x="444" y="480" width="10" height="16" rx="2" opacity="0.5"/>
    </g>
    <rect x="930" y="430" width="148" height="44" rx="8" fill="#4f8cff"/>
    <text x="1004" y="458" fill="#ffffff" font-size="17" font-weight="600" text-anchor="middle">Start test</text>
    <!-- enhancements -->
    <rect x="340" y="524" width="760" height="70" rx="10" fill="#ffffff"/>
    <text x="364" y="566" fill="#1d2433" font-size="17">Audio enhancements</text>
    <text x="1078" y="566" fill="#3c4458" font-size="16" text-anchor="end">Device Default Effects  ⌄</text>
  </g>
  <!-- callout -->
  <g font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
    <circle cx="1100" cy="420" r="22" fill="#ff8a3d"/>
    <text x="1100" y="428" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">1</text>
    <circle cx="680" cy="318" r="22" fill="#ff8a3d"/>
    <text x="680" y="326" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">2</text>
  </g>
</svg>
