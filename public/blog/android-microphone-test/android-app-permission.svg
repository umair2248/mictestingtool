<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Android app permissions screen: Settings, Apps, the app, Permissions, Microphone, set to Allow only while using the app</title>
  <g font-family="Roboto, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0f1a16"/>
    <text x="80" y="110" fill="#7ff0b0" font-size="20" font-weight="600" letter-spacing="2">ONE APP CAN'T HEAR YOU?</text>
    <text x="80" y="160" fill="#ffffff" font-size="36" font-weight="700">Give it microphone</text>
    <text x="80" y="204" fill="#ffffff" font-size="36" font-weight="700">permission</text>
    <g font-size="21" fill="#b6cbbf">
      <circle cx="96" cy="270" r="18" fill="#3ddc84"/><text x="96" y="277" fill="#0f1a16" font-weight="700" text-anchor="middle" font-size="18">1</text>
      <text x="130" y="277">Settings › Apps › the app</text>
      <circle cx="96" cy="326" r="18" fill="#3ddc84"/><text x="96" y="333" fill="#0f1a16" font-weight="700" text-anchor="middle" font-size="18">2</text>
      <text x="130" y="333">Permissions › Microphone</text>
      <circle cx="96" cy="382" r="18" fill="#3ddc84"/><text x="96" y="389" fill="#0f1a16" font-weight="700" text-anchor="middle" font-size="18">3</text>
      <text x="130" y="389">Allow only while using the app</text>
      <circle cx="96" cy="438" r="18" fill="#3ddc84"/><text x="96" y="445" fill="#0f1a16" font-weight="700" text-anchor="middle" font-size="18">4</text>
      <text x="130" y="445">Force stop the app, then reopen it</text>
    </g>
    <text x="80" y="530" fill="#7f9488" font-size="17">Rarely used app? Turn off "Pause app activity if unused"</text>
    <text x="80" y="556" fill="#7f9488" font-size="17">so Android doesn't take the permission away again.</text>

    <rect x="720" y="50" width="320" height="580" rx="34" fill="#1f2421" stroke="#3a423d" stroke-width="5"/>
    <rect x="734" y="64" width="292" height="552" rx="24" fill="#f4f7f5"/>
    <circle cx="880" cy="82" r="7" fill="#1f2421"/>
    <text x="754" y="136" fill="#1f2421" font-size="22">←</text>
    <text x="754" y="184" fill="#1f2421" font-size="26" font-weight="700">Microphone</text>
    <text x="754" y="210" fill="#6b7570" font-size="14">permission</text>
    <rect x="754" y="230" width="44" height="44" rx="12" fill="#25d366"/>
    <text x="812" y="258" fill="#1f2421" font-size="17" font-weight="700">WhatsApp</text>
    <text x="754" y="314" fill="#1a7f45" font-size="13" font-weight="700">MICROPHONE ACCESS FOR THIS APP</text>
    <g font-size="16" fill="#1f2421">
      <rect x="748" y="330" width="264" height="54" rx="14" fill="#c4eed3"/>
      <circle cx="774" cy="357" r="10" fill="none" stroke="#1a7f45" stroke-width="3"/><circle cx="774" cy="357" r="5" fill="#1a7f45"/>
      <text x="796" y="352" font-weight="700">Allow only while</text>
      <text x="796" y="372" font-weight="700">using the app</text>
      <circle cx="774" cy="414" r="10" fill="none" stroke="#6b7570" stroke-width="3"/>
      <text x="796" y="420">Ask every time</text>
      <circle cx="774" cy="464" r="10" fill="none" stroke="#6b7570" stroke-width="3"/>
      <text x="796" y="470">Don't allow</text>
    </g>
    <line x1="754" y1="502" x2="1006" y2="502" stroke="#dde3df"/>
    <text x="754" y="538" fill="#6b7570" font-size="14">Pause app activity if unused</text>
    <rect x="958" y="522" width="44" height="24" rx="12" fill="#c9d1cc"/><circle cx="972" cy="534" r="9" fill="#ffffff"/>
  </g>
</svg>
