    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8db4ff"/><stop offset="1" stop-color="#3a6fe0"/></linearGradient>
  </defs>
  <g font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">

