<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">Microphone not working: a muted microphone icon beside a fix checklist for mute, microphone access, input device, app permission and drivers</title>
