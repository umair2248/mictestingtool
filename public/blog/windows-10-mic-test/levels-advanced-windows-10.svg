<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Windows 10 Microphone Properties: Levels tab with Microphone level and Microphone Boost, and Advanced tab with exclusive mode turned off</title>
  <rect width="1200" height="675" fill="#0f172e"/>
  <g font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
    <text x="600" y="56" fill="#b8c4e0" font-size="20" text-anchor="middle">Recording tab  ›  Microphone  ›  Properties</text>

    <rect x="50" y="86" width="530" height="530" rx="6" fill="#f3f5fa"/>
    <rect x="50" y="86" width="530" height="42" rx="6" fill="#e4e8f2"/><rect x="50" y="114" width="530" height="14" fill="#e4e8f2"/>
    <text x="70" y="114" fill="#1d2433" font-size="17">Microphone Properties</text>
    <g font-size="15" fill="#3c4458"><text x="74" y="164">General</text><text x="140" y="164">Listen</text>
      <rect x="194" y="142" width="62" height="32" fill="#fff" stroke="#c5ccdc"/><text x="225" y="164" text-anchor="middle" font-weight="600" fill="#1d2433">Levels</text>
      <text x="270" y="164">Enhancements</text><text x="386" y="164">Advanced</text></g>
    <rect x="70" y="174" width="490" height="360" fill="#fff" stroke="#c5ccdc"/>
    <rect x="84" y="192" width="462" height="128" rx="4" fill="#eaf1ff" stroke="#4f8cff" stroke-width="3"/>
    <text x="100" y="224" fill="#1d2433" font-size="17" font-weight="600">Microphone</text>
    <rect x="100" y="256" width="320" height="6" fill="#d6dbe8"/><rect x="100" y="256" width="256" height="6" fill="#0078d4"/>
    <rect x="350" y="242" width="12" height="34" fill="#0078d4"/>
    <rect x="440" y="244" width="50" height="30" fill="#fff" stroke="#9aa4bb"/><text x="465" y="265" fill="#1d2433" font-size="16" text-anchor="middle">80</text>
    <text x="100" y="304" fill="#5b6478" font-size="14">Raise this first (70–90 suits most mics)</text>
    <rect x="84" y="336" width="462" height="128" rx="4" fill="#fff6ee" stroke="#ff8a3d" stroke-width="3"/>
    <text x="100" y="368" fill="#1d2433" font-size="17" font-weight="600">Microphone Boost</text>
    <rect x="100" y="400" width="320" height="6" fill="#d6dbe8"/><rect x="100" y="400" width="107" height="6" fill="#ff8a3d"/>
    <rect x="201" y="386" width="12" height="34" fill="#ff8a3d"/>
    <text x="440" y="408" fill="#5b6478" font-size="14">+10.0 dB</text>
    <text x="100" y="446" fill="#5b6478" font-size="14">Only if still too quiet. Adds hiss and noise.</text>
    <g font-size="14" text-anchor="middle"><rect x="300" y="552" width="80" height="30" fill="#0078d4"/><text x="340" y="572" fill="#fff">OK</text><rect x="390" y="552" width="80" height="30" fill="#fff" stroke="#9aa4bb"/><text x="430" y="572" fill="#1d2433">Cancel</text><rect x="480" y="552" width="80" height="30" fill="#fff" stroke="#9aa4bb"/><text x="520" y="572" fill="#1d2433">Apply</text></g>

    <rect x="620" y="86" width="530" height="530" rx="6" fill="#f3f5fa"/>
    <rect x="620" y="86" width="530" height="42" rx="6" fill="#e4e8f2"/><rect x="620" y="114" width="530" height="14" fill="#e4e8f2"/>
    <text x="640" y="114" fill="#1d2433" font-size="17">Microphone Properties</text>
    <g font-size="15" fill="#3c4458"><text x="644" y="164">General</text><text x="710" y="164">Listen</text><text x="766" y="164">Levels</text><text x="826" y="164">Enhancements</text>
      <rect x="936" y="142" width="82" height="32" fill="#fff" stroke="#c5ccdc"/><text x="977" y="164" text-anchor="middle" font-weight="600" fill="#1d2433">Advanced</text></g>
    <rect x="640" y="174" width="490" height="360" fill="#fff" stroke="#c5ccdc"/>
    <text x="660" y="210" fill="#1d2433" font-size="16" font-weight="600">Default Format</text>
    <rect x="660" y="224" width="450" height="32" fill="#fff" stroke="#9aa4bb"/><text x="672" y="246" fill="#1d2433" font-size="14">2 channel, 16 bit, 48000 Hz (DVD Quality)</text>
    <rect x="654" y="284" width="462" height="132" rx="4" fill="#fff6ee" stroke="#ff8a3d" stroke-width="3"/>
    <text x="670" y="316" fill="#1d2433" font-size="16" font-weight="600">Exclusive Mode</text>
    <rect x="670" y="334" width="18" height="18" fill="#fff" stroke="#5b6478" stroke-width="2"/>
    <text x="700" y="349" fill="#1d2433" font-size="14">Allow applications to take exclusive control</text>
    <rect x="670" y="368" width="18" height="18" fill="#fff" stroke="#5b6478" stroke-width="2"/>
    <text x="700" y="383" fill="#1d2433" font-size="14">Give exclusive mode applications priority</text>
    <text x="670" y="404" fill="#5b6478" font-size="13">Untick both if one app “steals” the mic from others</text>
    <g font-size="14" text-anchor="middle"><rect x="870" y="552" width="80" height="30" fill="#0078d4"/><text x="910" y="572" fill="#fff">OK</text><rect x="960" y="552" width="80" height="30" fill="#fff" stroke="#9aa4bb"/><text x="1000" y="572" fill="#1d2433">Cancel</text><rect x="1050" y="552" width="80" height="30" fill="#fff" stroke="#9aa4bb"/><text x="1090" y="572" fill="#1d2433">Apply</text></g>
  </g>
  <g font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
    <circle cx="546" cy="192" r="20" fill="#ff8a3d"/><text x="546" y="199" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">1</text>
    <circle cx="546" cy="336" r="20" fill="#ff8a3d"/><text x="546" y="343" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">2</text>
    <circle cx="1116" cy="284" r="20" fill="#ff8a3d"/><text x="1116" y="291" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">3</text>
  </g>
</svg>
