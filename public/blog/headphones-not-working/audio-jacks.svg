<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t">
  <title id="t">Desktop PC audio jacks: green is headphones, pink is microphone, blue is line in</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="560" fill="#0f1b2e"/>
    <text x="600" y="58" fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">Which jack on the back of your PC?</text>
    <rect x="250" y="100" width="700" height="330" rx="14" fill="#1b2230" stroke="#3b4d68" stroke-width="3"/>
    <circle cx="400" cy="260" r="46" fill="#4cc9f0"/><circle cx="400" cy="260" r="16" fill="#0b1020"/>
    <circle cx="600" cy="260" r="46" fill="#2ec27e" stroke="#ffffff" stroke-width="5"/><circle cx="600" cy="260" r="16" fill="#0b1020"/>
    <circle cx="800" cy="260" r="46" fill="#ff7eb6"/><circle cx="800" cy="260" r="16" fill="#0b1020"/>
    <text x="400" y="360" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Blue</text>
    <text x="400" y="392" fill="#b8c8de" font-size="18" text-anchor="middle">Line in</text>
    <text x="600" y="360" fill="#2ec27e" font-size="22" font-weight="700" text-anchor="middle">Green</text>
    <text x="600" y="392" fill="#ffffff" font-size="18" text-anchor="middle">Headphones / speakers</text>
    <text x="800" y="360" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Pink</text>
    <text x="800" y="392" fill="#b8c8de" font-size="18" text-anchor="middle">Microphone</text>
    <text x="600" y="160" fill="#2ec27e" font-size="20" font-weight="700" text-anchor="middle">Plug headphones in here</text>
    <path d="M600 172 L600 200" stroke="#2ec27e" stroke-width="4"/><path d="M590 192 L600 206 L610 192" fill="none" stroke="#2ec27e" stroke-width="4"/>
    <text x="600" y="480" fill="#b8c8de" font-size="18" text-anchor="middle">Headset with one 4-pole plug? Laptops take it directly. Desktops with separate</text>
    <text x="600" y="508" fill="#b8c8de" font-size="18" text-anchor="middle">green and pink jacks need a splitter, or the mic won't work.</text>
  </g>
</svg>
