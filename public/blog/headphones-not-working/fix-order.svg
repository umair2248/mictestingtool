<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Headphones not working on PC: fixes in order, from volume and output device, through jack and port checks, to Bluetooth, troubleshooter and audio driver</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0f1b2e"/>
    <text x="600" y="58" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">Headphones not working? Go in this order</text>
    <text x="600" y="92" fill="#8b99ad" font-size="17" text-anchor="middle">Quickest and most common at the top. Play a sound after each step.</text>
    <g font-size="21">
      <rect x="100" y="120" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="128" y="164" fill="#2ec27e" font-weight="700">1</text><text x="160" y="164" fill="#ffffff" font-weight="700">Volume and mute</text>
      <text x="160" y="196" fill="#b8c8de" font-size="16">Headset wheel, Windows, and the app</text>
      <rect x="620" y="120" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="648" y="164" fill="#2ec27e" font-weight="700">2</text><text x="680" y="164" fill="#ffffff" font-weight="700">Pick the output device</text>
      <text x="680" y="196" fill="#b8c8de" font-size="16">Speaker icon &gt; arrow &gt; Headphones</text>
      <rect x="100" y="244" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="128" y="288" fill="#2ec27e" font-weight="700">3</text><text x="160" y="288" fill="#ffffff" font-weight="700">Plug and jack</text>
      <text x="160" y="320" fill="#b8c8de" font-size="16">All the way in, green jack, no lint</text>
      <rect x="620" y="244" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="648" y="288" fill="#f5c542" font-weight="700">4</text><text x="680" y="288" fill="#ffffff" font-weight="700">Test on your phone</text>
      <text x="680" y="320" fill="#b8c8de" font-size="16">Silent there too? It is the headphones.</text>
      <rect x="100" y="368" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="128" y="412" fill="#f5c542" font-weight="700">5</text><text x="160" y="412" fill="#ffffff" font-weight="700">USB or Bluetooth checks</text>
      <text x="160" y="444" fill="#b8c8de" font-size="16">Right device entry, phone disconnected</text>
      <rect x="620" y="368" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="648" y="412" fill="#f5c542" font-weight="700">6</text><text x="680" y="412" fill="#ffffff" font-weight="700">Sound troubleshooter</text>
      <text x="680" y="444" fill="#b8c8de" font-size="16">Right-click speaker icon &gt; Troubleshoot</text>
      <rect x="100" y="492" width="480" height="104" rx="14" fill="#16263f" stroke="#f5a65b" stroke-width="2"/>
      <text x="128" y="536" fill="#f5a65b" font-weight="700">7</text><text x="160" y="536" fill="#ffffff" font-weight="700">Update audio driver</text>
      <text x="160" y="568" fill="#b8c8de" font-size="16">Device Manager or the laptop maker</text>
      <rect x="620" y="492" width="480" height="104" rx="14" fill="#16263f" stroke="#f5a65b" stroke-width="2"/>
      <text x="648" y="536" fill="#f5a65b" font-weight="700">8</text><text x="680" y="536" fill="#ffffff" font-weight="700">App and volume mixer</text>
      <text x="680" y="568" fill="#b8c8de" font-size="16">Each app can have its own output</text>
    </g>
    <text x="600" y="640" fill="#8b99ad" font-size="16" text-anchor="middle">Still nothing? A cheap USB sound adapter bypasses the PC headphone jack completely.</text>
  </g>
</svg>
