<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Laptop camera not working on Windows: privacy shutter, camera hotkey, privacy settings, other apps, driver and Windows updates in order</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0f1b2e"/>
    <text x="600" y="58" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">ASUS or laptop camera not working? Go in this order</text>
    <text x="600" y="92" fill="#8b99ad" font-size="17" text-anchor="middle">Open the webcam test or the Windows Camera app after each step.</text>
    <g font-size="21">
      <rect x="100" y="120" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="128" y="164" fill="#2ec27e" font-weight="700">1</text><text x="160" y="164" fill="#ffffff" font-weight="700">Open the privacy shutter</text>
      <text x="160" y="196" fill="#b8c8de" font-size="16">Small slider above the screen on many models</text>
      <rect x="620" y="120" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="648" y="164" fill="#2ec27e" font-weight="700">2</text><text x="680" y="164" fill="#ffffff" font-weight="700">Press the camera hotkey</text>
      <text x="680" y="196" fill="#b8c8de" font-size="16">F10 or Fn + F10, look for "Camera on"</text>
      <rect x="100" y="244" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="128" y="288" fill="#2ec27e" font-weight="700">3</text><text x="160" y="288" fill="#ffffff" font-weight="700">Windows camera privacy</text>
      <text x="160" y="320" fill="#b8c8de" font-size="16">Settings &gt; Privacy &amp; security &gt; Camera</text>
      <rect x="620" y="244" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="648" y="288" fill="#f5c542" font-weight="700">4</text><text x="680" y="288" fill="#ffffff" font-weight="700">Close other camera apps</text>
      <text x="680" y="320" fill="#b8c8de" font-size="16">Zoom, Teams, OBS, browser tabs</text>
      <rect x="100" y="368" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="128" y="412" fill="#f5c542" font-weight="700">5</text><text x="160" y="412" fill="#ffffff" font-weight="700">Pick the right camera</text>
      <text x="160" y="444" fill="#b8c8de" font-size="16">Not the Windows Hello IR camera</text>
      <rect x="620" y="368" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="648" y="412" fill="#f5c542" font-weight="700">6</text><text x="680" y="412" fill="#ffffff" font-weight="700">Reinstall the driver</text>
      <text x="680" y="444" fill="#b8c8de" font-size="16">Device Manager &gt; Cameras &gt; Uninstall</text>
      <rect x="100" y="492" width="480" height="104" rx="14" fill="#16263f" stroke="#f5a65b" stroke-width="2"/>
      <text x="128" y="536" fill="#f5a65b" font-weight="700">7</text><text x="160" y="536" fill="#ffffff" font-weight="700">Update BIOS, Windows, drivers</text>
      <text x="160" y="568" fill="#b8c8de" font-size="16">Windows Update and MyASUS</text>
      <rect x="620" y="492" width="480" height="104" rx="14" fill="#16263f" stroke="#f5a65b" stroke-width="2"/>
      <text x="648" y="536" fill="#f5a65b" font-weight="700">8</text><text x="680" y="536" fill="#ffffff" font-weight="700">Warranty or repair</text>
      <text x="680" y="568" fill="#b8c8de" font-size="16">Use a USB webcam in the meantime</text>
    </g>
    <text x="600" y="640" fill="#8b99ad" font-size="16" text-anchor="middle">Camera missing from Device Manager even with the shutter open and F10 on? Skip to 8.</text>
  </g>
</svg>
