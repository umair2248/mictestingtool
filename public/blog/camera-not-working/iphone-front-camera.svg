<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">iPhone front camera not working: fixes in order from removing the case and screen protector to restart, permissions, update and repair</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0f1b2e"/>
    <text x="600" y="58" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">iPhone front camera not working? Go in this order</text>
    <text x="600" y="92" fill="#8b99ad" font-size="17" text-anchor="middle">Flip to the selfie camera in the Camera app after each step.</text>
    <g font-size="21">
      <rect x="100" y="120" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="128" y="164" fill="#2ec27e" font-weight="700">1</text><text x="160" y="164" fill="#ffffff" font-weight="700">Case and screen protector off</text>
      <text x="160" y="196" fill="#b8c8de" font-size="16">Film, notch cut-outs and magnets block it</text>
      <rect x="620" y="120" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="648" y="164" fill="#2ec27e" font-weight="700">2</text><text x="680" y="164" fill="#ffffff" font-weight="700">Clean the front lens</text>
      <text x="680" y="196" fill="#b8c8de" font-size="16">Dry microfibre cloth, top of the screen</text>
      <rect x="100" y="244" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="128" y="288" fill="#2ec27e" font-weight="700">3</text><text x="160" y="288" fill="#ffffff" font-weight="700">Switch cameras a few times</text>
      <text x="160" y="320" fill="#b8c8de" font-size="16">Tap the rotate button in the Camera app</text>
      <rect x="620" y="244" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="648" y="288" fill="#f5c542" font-weight="700">4</text><text x="680" y="288" fill="#ffffff" font-weight="700">Close Camera and restart</text>
      <text x="680" y="320" fill="#b8c8de" font-size="16">Force restart if the screen stays black</text>
      <rect x="100" y="368" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="128" y="412" fill="#f5c542" font-weight="700">5</text><text x="160" y="412" fill="#ffffff" font-weight="700">App camera permission</text>
      <text x="160" y="444" fill="#b8c8de" font-size="16">Settings &gt; Privacy &amp; Security &gt; Camera</text>
      <rect x="620" y="368" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="648" y="412" fill="#f5c542" font-weight="700">6</text><text x="680" y="412" fill="#ffffff" font-weight="700">Update iOS</text>
      <text x="680" y="444" fill="#b8c8de" font-size="16">Settings &gt; General &gt; Software Update</text>
      <rect x="100" y="492" width="480" height="104" rx="14" fill="#16263f" stroke="#f5a65b" stroke-width="2"/>
      <text x="128" y="536" fill="#f5a65b" font-weight="700">7</text><text x="160" y="536" fill="#ffffff" font-weight="700">Recent drop or repair?</text>
      <text x="160" y="568" fill="#b8c8de" font-size="16">Face ID failing too points to hardware</text>
      <rect x="620" y="492" width="480" height="104" rx="14" fill="#16263f" stroke="#f5a65b" stroke-width="2"/>
      <text x="648" y="536" fill="#f5a65b" font-weight="700">8</text><text x="680" y="536" fill="#ffffff" font-weight="700">Apple repair</text>
      <text x="680" y="568" fill="#b8c8de" font-size="16">Apple or an authorised service provider</text>
    </g>
    <text x="600" y="640" fill="#8b99ad" font-size="16" text-anchor="middle">Back camera fine and front camera black after a drop or screen repair? Skip to 8.</text>
  </g>
</svg>
