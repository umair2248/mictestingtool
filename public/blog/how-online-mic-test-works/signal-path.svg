<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t">
  <title id="t">How an online mic test works: microphone, browser permission, live level meter, local recording and playback, with the server crossed out</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="560" fill="#0f1b2e"/>
    <text x="600" y="56" fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">What happens when you press Start</text>
    <rect x="40" y="100" width="1120" height="290" rx="18" fill="none" stroke="#2a4866" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="64" y="130" fill="#7dd8f5" font-size="16" font-weight="700" letter-spacing="2">INSIDE YOUR BROWSER TAB</text>
    <g transform="translate(130 260) scale(0.9)"><rect x="-22" y="-60" width="44" height="80" rx="22" fill="#cfe3ee"/><path d="M-36 0 Q-36 40 0 40 Q36 40 36 0" fill="none" stroke="#cfe3ee" stroke-width="6"/><rect x="-3" y="40" width="6" height="24" fill="#cfe3ee"/><rect x="-22" y="62" width="44" height="6" rx="3" fill="#cfe3ee"/></g>
    <text x="130" y="350" fill="#cfe3ee" font-size="17" text-anchor="middle">Your mic</text>
    <rect x="230" y="190" width="200" height="120" rx="14" fill="#16263f" stroke="#4cc9f0" stroke-width="2"/><text x="330" y="240" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">Permission</text><text x="330" y="274" fill="#b8c8de" font-size="16" text-anchor="middle">You click Allow</text><rect x="460" y="190" width="200" height="120" rx="14" fill="#16263f" stroke="#4cc9f0" stroke-width="2"/><text x="560" y="240" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">Raw input</text><text x="560" y="274" fill="#b8c8de" font-size="16" text-anchor="middle">Filters switched off</text><rect x="690" y="190" width="200" height="120" rx="14" fill="#16263f" stroke="#4cc9f0" stroke-width="2"/><text x="790" y="240" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">Level meter</text><text x="790" y="274" fill="#b8c8de" font-size="16" text-anchor="middle">Live, not saved</text><rect x="920" y="190" width="200" height="120" rx="14" fill="#16263f" stroke="#4cc9f0" stroke-width="2"/><text x="1020" y="240" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">Recording</text><text x="1020" y="274" fill="#b8c8de" font-size="16" text-anchor="middle">Held in memory</text>
    <path d="M200 250 L226 250" stroke="#7dd8f5" stroke-width="4"/><path d="M220 242 L230 250 L220 258" fill="none" stroke="#7dd8f5" stroke-width="4"/><path d="M430 250 L456 250" stroke="#7dd8f5" stroke-width="4"/><path d="M450 242 L460 250 L450 258" fill="none" stroke="#7dd8f5" stroke-width="4"/><path d="M660 250 L686 250" stroke="#7dd8f5" stroke-width="4"/><path d="M680 242 L690 250 L680 258" fill="none" stroke="#7dd8f5" stroke-width="4"/><path d="M890 250 L916 250" stroke="#7dd8f5" stroke-width="4"/><path d="M910 242 L920 250 L910 258" fill="none" stroke="#7dd8f5" stroke-width="4"/>
    <rect x="460" y="430" width="280" height="90" rx="14" fill="#2a1a1f" stroke="#ff6b6b" stroke-width="2"/>
    <text x="600" y="470" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">Our server</text>
    <text x="600" y="500" fill="#ffb3b3" font-size="16" text-anchor="middle">Receives no audio</text>
    <path d="M1020 310 L1020 380 Q1020 400 1000 400 L760 470" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M870 415 L910 455 M910 415 L870 455" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
