<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t">
  <title id="t">Browser microphone processing on and off: with echo cancellation, noise suppression and auto gain the level looks even; with them off you see the real mic level and background noise</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="560" fill="#0f1b2e"/>
    <text x="600" y="56" fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">Same quiet mic, two very different meters</text>
    <rect x="60" y="100" width="520" height="400" rx="16" fill="#16263f" stroke="#3b4d68" stroke-width="2"/>
    <text x="320" y="146" fill="#cfe3ee" font-size="22" font-weight="700" text-anchor="middle">Call apps (processing on)</text>
    <text x="320" y="176" fill="#8b99ad" font-size="16" text-anchor="middle">Echo cancel · Noise suppression · Auto gain</text>
    <rect x="130" y="277" width="22" height="93" rx="4" fill="#2ec27e"/><rect x="160" y="265" width="22" height="105" rx="4" fill="#2ec27e"/><rect x="190" y="271" width="22" height="99" rx="4" fill="#2ec27e"/><rect x="220" y="262" width="22" height="108" rx="4" fill="#2ec27e"/><rect x="250" y="268" width="22" height="102.00000000000001" rx="4" fill="#2ec27e"/><rect x="280" y="265" width="22" height="105" rx="4" fill="#2ec27e"/><rect x="310" y="274" width="22" height="96" rx="4" fill="#2ec27e"/><rect x="340" y="265" width="22" height="105" rx="4" fill="#2ec27e"/><rect x="370" y="271" width="22" height="99" rx="4" fill="#2ec27e"/><rect x="400" y="265" width="22" height="105" rx="4" fill="#2ec27e"/><rect x="430" y="268" width="22" height="102.00000000000001" rx="4" fill="#2ec27e"/><rect x="460" y="271" width="22" height="99" rx="4" fill="#2ec27e"/><rect x="490" y="265" width="22" height="105" rx="4" fill="#2ec27e"/>
    <text x="320" y="420" fill="#b8c8de" font-size="18" text-anchor="middle">Looks fine, even if the mic is set too low</text>
    <text x="320" y="450" fill="#b8c8de" font-size="18" text-anchor="middle">and hums. The problem is hidden.</text>
    <rect x="620" y="100" width="520" height="400" rx="16" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
    <text x="880" y="146" fill="#2ec27e" font-size="22" font-weight="700" text-anchor="middle">Our mic test (processing off)</text>
    <text x="880" y="176" fill="#8b99ad" font-size="16" text-anchor="middle">What the microphone really sends</text>
    <rect x="690" y="352" width="22" height="18" rx="4" fill="#2ec27e"/><rect x="720" y="340" width="22" height="30" rx="4" fill="#2ec27e"/><rect x="750" y="322" width="22" height="48" rx="4" fill="#2ec27e"/><rect x="780" y="343" width="22" height="27" rx="4" fill="#2ec27e"/><rect x="810" y="310" width="22" height="60" rx="4" fill="#2ec27e"/><rect x="840" y="331" width="22" height="39" rx="4" fill="#2ec27e"/><rect x="870" y="349" width="22" height="21.000000000000004" rx="4" fill="#2ec27e"/><rect x="900" y="325" width="22" height="45" rx="4" fill="#2ec27e"/><rect x="930" y="337" width="22" height="33" rx="4" fill="#2ec27e"/><rect x="960" y="352" width="22" height="18" rx="4" fill="#2ec27e"/><rect x="990" y="355" width="22" height="15" rx="4" fill="#2ec27e"/><rect x="1020" y="355" width="22" height="15" rx="4" fill="#2ec27e"/><rect x="1050" y="355" width="22" height="15" rx="4" fill="#2ec27e"/>
    <line x1="690" y1="355" x2="1070" y2="355" stroke="#f5c542" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="1070" y="348" fill="#f5c542" font-size="14" text-anchor="end">background hum</text>
    <text x="880" y="420" fill="#b8c8de" font-size="18" text-anchor="middle">Quiet mic looks quiet, noise shows up.</text>
    <text x="880" y="450" fill="#b8c8de" font-size="18" text-anchor="middle">Now you know what to fix.</text>
  </g>
</svg>
