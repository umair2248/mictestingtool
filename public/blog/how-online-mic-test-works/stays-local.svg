<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t">
  <title id="t">Mic test privacy: the recording stays in the browser tab, is cleared on discard or when you close the tab, and is never sent to a server</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="520" fill="#0f1b2e"/>
    <text x="600" y="56" fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">The life of your test recording</text>
    <rect x="60" y="110" width="240" height="220" rx="16" fill="#16263f" stroke="#2ec27e" stroke-width="2"/><text x="180" y="160" fill="#2ec27e" font-size="21" font-weight="700" text-anchor="middle">1. Recording</text><text x="180" y="220" fill="#ffffff" font-size="16" text-anchor="middle">Chunks held in tab memory</text><text x="180" y="270" fill="#b8c8de" font-size="16" text-anchor="middle">Mic light on</text><rect x="340" y="110" width="240" height="220" rx="16" fill="#16263f" stroke="#4cc9f0" stroke-width="2"/><text x="460" y="160" fill="#4cc9f0" font-size="21" font-weight="700" text-anchor="middle">2. Stop</text><text x="460" y="220" fill="#ffffff" font-size="16" text-anchor="middle">Becomes one local clip</text><text x="460" y="270" fill="#b8c8de" font-size="16" text-anchor="middle">Mic turned off</text><rect x="620" y="110" width="240" height="220" rx="16" fill="#16263f" stroke="#4cc9f0" stroke-width="2"/><text x="740" y="160" fill="#4cc9f0" font-size="21" font-weight="700" text-anchor="middle">3. Play or download</text><text x="740" y="220" fill="#ffffff" font-size="16" text-anchor="middle">.webm (Chrome) .m4a (Safari)</text><text x="740" y="270" fill="#b8c8de" font-size="16" text-anchor="middle">Saved only if you click</text><rect x="900" y="110" width="240" height="220" rx="16" fill="#16263f" stroke="#f5a65b" stroke-width="2"/><text x="1020" y="160" fill="#f5a65b" font-size="21" font-weight="700" text-anchor="middle">4. Discard or close tab</text><text x="1020" y="220" fill="#ffffff" font-size="16" text-anchor="middle">Clip removed from memory</text><text x="1020" y="270" fill="#b8c8de" font-size="16" text-anchor="middle">Nothing left behind</text>
    <path d="M305 220 L331 220" stroke="#7dd8f5" stroke-width="4"/><path d="M325 212 L335 220 L325 228" fill="none" stroke="#7dd8f5" stroke-width="4"/><path d="M585 220 L611 220" stroke="#7dd8f5" stroke-width="4"/><path d="M605 212 L615 220 L605 228" fill="none" stroke="#7dd8f5" stroke-width="4"/><path d="M865 220 L891 220" stroke="#7dd8f5" stroke-width="4"/><path d="M885 212 L895 220 L885 228" fill="none" stroke="#7dd8f5" stroke-width="4"/>
    <rect x="300" y="380" width="600" height="80" rx="40" fill="#2a1a1f" stroke="#ff6b6b" stroke-width="2"/>
    <text x="600" y="428" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">Upload to a server: never happens</text>
  </g>
</svg>
