<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t">
  <title id="t">Why a mouse double clicks: a clean switch gives one signal, a worn switch bounces and sends two clicks</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="600" fill="#0f1b2e"/>
    <text x="600" y="60" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">What the PC sees when you press once</text>
    <text x="600" y="94" fill="#8b99ad" font-size="17" text-anchor="middle">The same single press, from a healthy switch and a worn one</text>
    <rect x="60" y="130" width="520" height="380" rx="16" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
    <text x="320" y="176" fill="#2ec27e" font-size="24" font-weight="700" text-anchor="middle">Healthy switch</text>
    <line x1="100" y1="400" x2="540" y2="400" stroke="#3b4d68" stroke-width="2"/>
    <polyline points="100,400 200,400 200,260 420,260 420,400 540,400" fill="none" stroke="#2ec27e" stroke-width="5" stroke-linejoin="round"/>
    <text x="310" y="245" fill="#ffffff" font-size="18" text-anchor="middle">one clean contact</text>
    <text x="320" y="460" fill="#b8c8de" font-size="20" text-anchor="middle">Windows counts: 1 click</text>
    <rect x="620" y="130" width="520" height="380" rx="16" fill="#16263f" stroke="#ff6b6b" stroke-width="2"/>
    <text x="880" y="176" fill="#ff6b6b" font-size="24" font-weight="700" text-anchor="middle">Worn switch</text>
    <line x1="660" y1="400" x2="1100" y2="400" stroke="#3b4d68" stroke-width="2"/>
    <polyline points="660,400 760,400 760,260 800,260 800,400 820,400 820,260 830,260 830,400 845,400 845,260 980,260 980,400 1100,400" fill="none" stroke="#ff6b6b" stroke-width="5" stroke-linejoin="round"/>
    <text x="805" y="245" fill="#ffffff" font-size="18" text-anchor="middle">bounce</text>
    <text x="880" y="460" fill="#b8c8de" font-size="20" text-anchor="middle">Windows counts: 2 clicks (or more)</text>
    <text x="600" y="560" fill="#8b99ad" font-size="16" text-anchor="middle">The gaps are only a few milliseconds long, so no double-click speed setting can catch them.</text>
  </g>
</svg>
