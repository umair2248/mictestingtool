<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Mouse double clicking fixes in order: single-click setting, double-click speed, mouse software and debounce, driver, battery and receiver, static, then warranty or switch replacement</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0f1b2e"/>
    <text x="600" y="58" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">Mouse double clicking? Go in this order</text>
    <text x="600" y="92" fill="#8b99ad" font-size="17" text-anchor="middle">Settings first, hardware last. Test with a slow click after each step.</text>
    <g font-size="21">
      <rect x="100" y="120" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="128" y="164" fill="#2ec27e" font-weight="700">1</text><text x="160" y="164" fill="#ffffff" font-weight="700">Double-click to open</text>
      <text x="160" y="196" fill="#b8c8de" font-size="16">File Explorer &gt; Options &gt; General</text>
      <rect x="620" y="120" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="648" y="164" fill="#2ec27e" font-weight="700">2</text><text x="680" y="164" fill="#ffffff" font-weight="700">Double-click speed</text>
      <text x="680" y="196" fill="#b8c8de" font-size="16">Middle or toward Fast. ClickLock off.</text>
      <rect x="100" y="244" width="480" height="104" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="128" y="288" fill="#2ec27e" font-weight="700">3</text><text x="160" y="288" fill="#ffffff" font-weight="700">Mouse app and debounce</text>
      <text x="160" y="320" fill="#b8c8de" font-size="16">No macros on left click. Try 8 to 10 ms.</text>
      <rect x="620" y="244" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="648" y="288" fill="#f5c542" font-weight="700">4</text><text x="680" y="288" fill="#ffffff" font-weight="700">Reinstall the driver</text>
      <text x="680" y="320" fill="#b8c8de" font-size="16">Device Manager &gt; Uninstall &gt; restart</text>
      <rect x="100" y="368" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="128" y="412" fill="#f5c542" font-weight="700">5</text><text x="160" y="412" fill="#ffffff" font-weight="700">Battery and receiver</text>
      <text x="160" y="444" fill="#b8c8de" font-size="16">Fresh battery, receiver closer to the mouse</text>
      <rect x="620" y="368" width="480" height="104" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="648" y="412" fill="#f5c542" font-weight="700">6</text><text x="680" y="412" fill="#ffffff" font-weight="700">Discharge static</text>
      <text x="680" y="444" fill="#b8c8de" font-size="16">Unplug, hold both buttons 30 seconds</text>
      <rect x="100" y="492" width="480" height="104" rx="14" fill="#16263f" stroke="#f5a65b" stroke-width="2"/>
      <text x="128" y="536" fill="#f5a65b" font-weight="700">7</text><text x="160" y="536" fill="#ffffff" font-weight="700">Warranty claim</text>
      <text x="160" y="568" fill="#b8c8de" font-size="16">A worn switch is a known, covered fault</text>
      <rect x="620" y="492" width="480" height="104" rx="14" fill="#16263f" stroke="#f5a65b" stroke-width="2"/>
      <text x="648" y="536" fill="#f5a65b" font-weight="700">8</text><text x="680" y="536" fill="#ffffff" font-weight="700">Clean or replace the switch</text>
      <text x="680" y="568" fill="#b8c8de" font-size="16">Only once the warranty is over</text>
    </g>
    <text x="600" y="640" fill="#8b99ad" font-size="16" text-anchor="middle">Double clicks on every PC you try? Skip straight to 7.</text>
  </g>
</svg>
