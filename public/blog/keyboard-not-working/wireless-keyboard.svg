<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Wireless keyboard not working but mouse is working: separate batteries, a separate receiver or pairing, and channel buttons on the keyboard</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0f1b2e"/>
    <text x="600" y="62" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">Mouse works, keyboard doesn't?</text>
    <text x="600" y="98" fill="#8b99ad" font-size="18" text-anchor="middle">They often have their own batteries, their own receiver and their own pairing.</text>

    <rect x="80" y="170" width="560" height="200" rx="18" fill="#1a2336" stroke="#f26d6d" stroke-width="3"/>
    <g fill="#2a3346" stroke="#5f6b80" stroke-width="2">
      <rect x="110" y="230" width="40" height="36" rx="6"/><rect x="158" y="230" width="40" height="36" rx="6"/><rect x="206" y="230" width="40" height="36" rx="6"/><rect x="254" y="230" width="40" height="36" rx="6"/><rect x="302" y="230" width="40" height="36" rx="6"/><rect x="350" y="230" width="40" height="36" rx="6"/><rect x="398" y="230" width="40" height="36" rx="6"/><rect x="446" y="230" width="40" height="36" rx="6"/><rect x="494" y="230" width="40" height="36" rx="6"/><rect x="542" y="230" width="68" height="36" rx="6"/>
      <rect x="126" y="274" width="40" height="36" rx="6"/><rect x="174" y="274" width="40" height="36" rx="6"/><rect x="222" y="274" width="40" height="36" rx="6"/><rect x="270" y="274" width="40" height="36" rx="6"/><rect x="318" y="274" width="40" height="36" rx="6"/><rect x="366" y="274" width="40" height="36" rx="6"/><rect x="414" y="274" width="40" height="36" rx="6"/><rect x="462" y="274" width="40" height="36" rx="6"/><rect x="510" y="274" width="100" height="36" rx="6"/>
      <rect x="200" y="318" width="300" height="34" rx="6"/>
    </g>
    <g font-size="16" font-weight="700" text-anchor="middle">
      <circle cx="140" cy="200" r="15" fill="#4fb6ff33" stroke="#4fb6ff" stroke-width="2"/><text x="140" y="206" fill="#4fb6ff">1</text>
      <circle cx="182" cy="200" r="15" fill="#2a3346" stroke="#5f6b80" stroke-width="2"/><text x="182" y="206" fill="#b8c8de">2</text>
      <circle cx="224" cy="200" r="15" fill="#2a3346" stroke="#5f6b80" stroke-width="2"/><text x="224" y="206" fill="#b8c8de">3</text>
    </g>
    <rect x="560" y="186" width="50" height="26" rx="13" fill="#2a3346" stroke="#f26d6d" stroke-width="2"/><circle cx="574" cy="199" r="9" fill="#f26d6d"/>
    <text x="585" y="160" fill="#f26d6d" font-size="15" font-weight="700" text-anchor="middle">OFF?</text>

    <path d="M820 190 q0 -40 50 -40 q50 0 50 40 v120 q0 60 -50 60 q-50 0 -50 -60 Z" fill="#1a2336" stroke="#2ec27e" stroke-width="3"/>
    <path d="M870 150 v60 M820 210 h100" stroke="#5f6b80" stroke-width="2"/>
    <text x="870" y="410" fill="#2ec27e" font-size="20" font-weight="700" text-anchor="middle">Mouse: working</text>

    <rect x="1000" y="250" width="70" height="40" rx="8" fill="#2a3346" stroke="#2ec27e" stroke-width="2"/>
    <rect x="1070" y="258" width="30" height="24" rx="3" fill="#5f6b80"/>
    <text x="1050" y="316" fill="#b8c8de" font-size="15" text-anchor="middle">Mouse receiver</text>
    <rect x="1000" y="340" width="70" height="40" rx="8" fill="#2a3346" stroke="#f26d6d" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="1070" y="348" width="30" height="24" rx="3" fill="#5f6b80"/>
    <text x="1050" y="406" fill="#b8c8de" font-size="15" text-anchor="middle">Keyboard receiver?</text>

    <g font-size="19">
      <rect x="80" y="470" width="320" height="130" rx="14" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
      <text x="104" y="512" fill="#ffffff" font-weight="700">Batteries and switch</text>
      <text x="104" y="546" fill="#b8c8de" font-size="16">Fresh batteries, charge it,</text>
      <text x="104" y="572" fill="#b8c8de" font-size="16">check the on/off switch</text>
      <rect x="440" y="470" width="320" height="130" rx="14" fill="#16263f" stroke="#4fb6ff" stroke-width="2"/>
      <text x="464" y="512" fill="#ffffff" font-weight="700">Channel buttons</text>
      <text x="464" y="546" fill="#b8c8de" font-size="16">Press 1, 2, 3 in turn. It may be</text>
      <text x="464" y="572" fill="#b8c8de" font-size="16">typing on another device.</text>
      <rect x="800" y="470" width="320" height="130" rx="14" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
      <text x="824" y="512" fill="#ffffff" font-weight="700">Receiver and pairing</text>
      <text x="824" y="546" fill="#b8c8de" font-size="16">Right receiver, USB 2 port,</text>
      <text x="824" y="572" fill="#b8c8de" font-size="16">then pair it again</text>
    </g>
  </g>
</svg>
