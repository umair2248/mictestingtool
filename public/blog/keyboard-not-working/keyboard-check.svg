<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Keyboard not working check: no keys work, some keys don't work, or the wrong characters appear, and what each result points to</title>
  <g font-family="-apple-system, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0f1b2e"/>
    <text x="600" y="62" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">Which keys fail tells you where to look</text>
    <text x="600" y="98" fill="#8b99ad" font-size="18" text-anchor="middle">Type every key in Notepad or TextEdit, then match the result.</text>

    <rect x="40" y="136" width="360" height="430" rx="18" fill="#16263f" stroke="#f26d6d" stroke-width="2"/>
    <text x="220" y="184" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">No keys work</text>
    <g fill="#f26d6d33" stroke="#f26d6d" stroke-width="2">
      <rect x="90" y="214" width="44" height="44" rx="7"/><rect x="144" y="214" width="44" height="44" rx="7"/><rect x="198" y="214" width="44" height="44" rx="7"/><rect x="252" y="214" width="44" height="44" rx="7"/><rect x="306" y="214" width="44" height="44" rx="7"/>
      <rect x="90" y="268" width="44" height="44" rx="7"/><rect x="144" y="268" width="44" height="44" rx="7"/><rect x="198" y="268" width="44" height="44" rx="7"/><rect x="252" y="268" width="44" height="44" rx="7"/><rect x="306" y="268" width="44" height="44" rx="7"/>
    </g>
    <g fill="#b8c8de" font-size="18" text-anchor="middle">
      <text x="220" y="374">Power, batteries, connection</text>
      <text x="220" y="404">Filter Keys / Slow Keys</text>
      <text x="220" y="434">Driver after an update</text>
      <text x="220" y="494" fill="#f5a65b">Dead in the BIOS too?</text>
      <text x="220" y="522" fill="#f5a65b">Hardware or loose cable</text>
    </g>

    <rect x="420" y="136" width="360" height="430" rx="18" fill="#16263f" stroke="#f5c542" stroke-width="2"/>
    <text x="600" y="184" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">Some keys don't</text>
    <g fill="#2a3346" stroke="#5f6b80" stroke-width="2">
      <rect x="470" y="214" width="44" height="44" rx="7"/><rect x="578" y="214" width="44" height="44" rx="7"/><rect x="632" y="214" width="44" height="44" rx="7"/>
      <rect x="470" y="268" width="44" height="44" rx="7"/><rect x="524" y="268" width="44" height="44" rx="7"/><rect x="686" y="268" width="44" height="44" rx="7"/>
    </g>
    <g fill="#f5c54233" stroke="#f5c542" stroke-width="3">
      <rect x="524" y="214" width="44" height="44" rx="7"/><rect x="686" y="214" width="44" height="44" rx="7"/><rect x="578" y="268" width="44" height="44" rx="7"/><rect x="632" y="268" width="44" height="44" rx="7"/>
    </g>
    <g fill="#b8c8de" font-size="18" text-anchor="middle">
      <text x="600" y="374">Crumbs or dust under keys</text>
      <text x="600" y="404">A spill</text>
      <text x="600" y="434">Keys repeating: worn or dirty</text>
      <text x="600" y="494" fill="#f5a65b">Whole row dead together?</text>
      <text x="600" y="522" fill="#f5a65b">Internal connection</text>
    </g>

    <rect x="800" y="136" width="360" height="430" rx="18" fill="#16263f" stroke="#2ec27e" stroke-width="2"/>
    <text x="980" y="184" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">Wrong characters</text>
    <rect x="850" y="214" width="260" height="98" rx="10" fill="#0f1b2e" stroke="#5f6b80" stroke-width="2"/>
    <text x="870" y="252" fill="#8b99ad" font-size="20">Typed:  hello@</text>
    <text x="870" y="290" fill="#2ec27e" font-size="20" font-weight="700">Got:  h3ll6"</text>
    <g fill="#b8c8de" font-size="18" text-anchor="middle">
      <text x="980" y="374">Keyboard layout or language</text>
      <text x="980" y="404">Num Lock on a small laptop</text>
      <text x="980" y="434">Fn lock on the top row</text>
      <text x="980" y="494" fill="#2ec27e">Always a setting.</text>
      <text x="980" y="522" fill="#2ec27e">Nothing is broken.</text>
    </g>
    <text x="600" y="624" fill="#8b99ad" font-size="17" text-anchor="middle">Still not sure? Try the keyboard on another computer. If the fault follows it, it's the keyboard.</text>
  </g>
</svg>
