<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Xbox mic test: party chat with only one member, the gamerpic ring lit up while talking and a headset icon next to the name</title>
  <g font-family="Roboto, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0d1424"/>
    <rect x="80" y="70" width="560" height="535" rx="18" fill="#151f35" stroke="#39445a" stroke-width="2"/>
    <text x="116" y="124" fill="#ffffff" font-size="28" font-weight="700">Party</text>
    <text x="116" y="156" fill="#b9c7de" font-size="17">1 member · party chat</text>
    <rect x="104" y="186" width="512" height="128" rx="14" fill="#1c2a45"/>
    <circle cx="176" cy="250" r="46" fill="none" stroke="#5cc15c" stroke-width="7"/>
    <circle cx="176" cy="250" r="36" fill="#3b4a66"/>
    <circle cx="176" cy="238" r="13" fill="#b9c7de"/><path d="M152 274 a24 20 0 0 1 48 0 Z" fill="#b9c7de"/>
    <text x="244" y="242" fill="#ffffff" font-size="22" font-weight="700">YourGamertag</text>
    <g transform="translate(244,262)" stroke="#5cc15c" stroke-width="3" fill="none"><path d="M2 20 V14 a12 12 0 0 1 24 0 V20"/><rect x="0" y="16" width="6" height="10" rx="2" fill="#5cc15c"/><rect x="22" y="16" width="6" height="10" rx="2" fill="#5cc15c"/><path d="M25 26 q0 6 -8 6"/></g>
    <text x="284" y="284" fill="#a6e3a1" font-size="17">Headset mic detected</text>
    <rect x="104" y="338" width="512" height="60" rx="12" fill="#1c2a45"/>
    <text x="130" y="375" fill="#ffffff" font-size="19">Invite more people</text>
    <rect x="104" y="414" width="512" height="60" rx="12" fill="#1c2a45"/>
    <text x="130" y="451" fill="#ffffff" font-size="19">Mute myself</text>
    <rect x="104" y="490" width="512" height="60" rx="12" fill="#1c2a45"/>
    <text x="130" y="527" fill="#ffffff" font-size="19">Switch to game chat</text>

    <text x="700" y="150" fill="#ffffff" font-size="28" font-weight="700">What to look for</text>
    <circle cx="722" cy="212" r="16" fill="none" stroke="#5cc15c" stroke-width="5"/>
    <text x="756" y="206" fill="#ffffff" font-size="20" font-weight="700">Ring lights up as you talk</text>
    <text x="756" y="234" fill="#b9c7de" font-size="17">The mic works</text>
    <circle cx="722" cy="302" r="16" fill="#3b4a66"/>
    <text x="756" y="296" fill="#ffffff" font-size="20" font-weight="700">Headset icon, no ring</text>
    <text x="756" y="324" fill="#b9c7de" font-size="17">Muted, or plug not fully in</text>
    <g transform="translate(708,378)"><circle cx="14" cy="14" r="16" fill="#3b4a66"/><line x1="2" y1="2" x2="26" y2="26" stroke="#f28b82" stroke-width="4"/></g>
    <text x="756" y="386" fill="#ffffff" font-size="20" font-weight="700">Muted mic icon</text>
    <text x="756" y="414" fill="#b9c7de" font-size="17">Unmute yourself in the party</text>
    <circle cx="722" cy="482" r="16" fill="none" stroke="#5f6b80" stroke-width="3" stroke-dasharray="5 5"/>
    <text x="756" y="476" fill="#ffffff" font-size="20" font-weight="700">No icon at all</text>
    <text x="756" y="504" fill="#b9c7de" font-size="17">No mic detected: check cable,</text>
    <text x="756" y="528" fill="#b9c7de" font-size="17">controller and firmware</text>
  </g>
</svg>
