<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">How to use an online noise meter for classroom: start the meter, set the too-loud limit, then switch to fullscreen classroom mode on the projector</title>
  <g font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0f172e"/>
    <text x="600" y="64" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">Set up the classroom noise meter in 3 steps</text>
    <text x="600" y="102" fill="#b8c4e0" font-size="20" text-anchor="middle">Place the device where it hears the whole room.</text>

    <rect x="60" y="150" width="330" height="440" rx="16" fill="#16213f" stroke="#4f8cff" stroke-width="2"/>
    <circle cx="104" cy="194" r="24" fill="#4f8cff"/><text x="104" y="203" fill="#0f172e" font-size="24" font-weight="700" text-anchor="middle">1</text>
    <text x="142" y="202" fill="#ffffff" font-size="22" font-weight="700">Start the meter</text>
    <text x="84" y="250" fill="#b8c4e0" font-size="17">Press Start noise meter and</text>
    <text x="84" y="276" fill="#b8c4e0" font-size="17">allow the microphone.</text>
    <rect x="110" y="330" width="230" height="56" rx="12" fill="#4f8cff"/>
    <text x="225" y="365" fill="#ffffff" font-size="19" font-weight="600" text-anchor="middle">Start noise meter</text>
    <rect x="120" y="420" width="210" height="130" rx="12" fill="#0a1222" stroke="#2a3a63"/>
    <text x="225" y="490" fill="#b8c4e0" font-size="16" text-anchor="middle">Allow microphone?</text>
    <rect x="160" y="508" width="130" height="30" rx="8" fill="#34d399"/>
    <text x="225" y="529" fill="#0f172e" font-size="15" font-weight="700" text-anchor="middle">Allow</text>

    <rect x="435" y="150" width="330" height="440" rx="16" fill="#16213f" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="479" cy="194" r="24" fill="#fbbf24"/><text x="479" y="203" fill="#0f172e" font-size="24" font-weight="700" text-anchor="middle">2</text>
    <text x="517" y="202" fill="#ffffff" font-size="22" font-weight="700">Set the limit</text>
    <text x="459" y="250" fill="#b8c4e0" font-size="17">Calibrate with Sensitivity, then</text>
    <text x="459" y="276" fill="#b8c4e0" font-size="17">drag the too-loud limit.</text>
    <text x="465" y="350" fill="#ffffff" font-size="17">Too-loud limit: 75</text>
    <rect x="465" y="366" width="270" height="8" rx="4" fill="#2a3a63"/><rect x="465" y="366" width="203" height="8" rx="4" fill="#4f8cff"/>
    <circle cx="668" cy="370" r="13" fill="#ffffff"/>
    <text x="465" y="440" fill="#ffffff" font-size="17">Sensitivity: 0</text>
    <rect x="465" y="456" width="270" height="8" rx="4" fill="#2a3a63"/><rect x="465" y="456" width="135" height="8" rx="4" fill="#4f8cff"/>
    <circle cx="600" cy="460" r="13" fill="#ffffff"/>
    <text x="465" y="530" fill="#8a97b8" font-size="15">Normal work should sit in the green.</text>

    <rect x="810" y="150" width="330" height="440" rx="16" fill="#16213f" stroke="#34d399" stroke-width="2"/>
    <circle cx="854" cy="194" r="24" fill="#34d399"/><text x="854" y="203" fill="#0f172e" font-size="24" font-weight="700" text-anchor="middle">3</text>
    <text x="892" y="202" fill="#ffffff" font-size="22" font-weight="700">Classroom mode</text>
    <text x="834" y="250" fill="#b8c4e0" font-size="17">Fullscreen on the board or</text>
    <text x="834" y="276" fill="#b8c4e0" font-size="17">projector for the whole class.</text>
    <rect x="840" y="320" width="270" height="170" rx="8" fill="#3a0d10" stroke="#f87171" stroke-width="3"/>
    <text x="975" y="400" fill="#f87171" font-size="60" font-weight="700" text-anchor="middle">82</text>
    <text x="975" y="438" fill="#f87171" font-size="22" font-weight="700" text-anchor="middle">Too loud!</text>
    <rect x="860" y="456" width="230" height="14" rx="7" fill="#5a1f24"/><rect x="860" y="456" width="189" height="14" rx="7" fill="#f87171"/>
    <rect x="960" y="490" width="30" height="40" fill="#2a3a63"/><rect x="920" y="528" width="110" height="10" rx="5" fill="#2a3a63"/>
    <text x="600" y="634" fill="#b8c4e0" font-size="18" text-anchor="middle">The screen turns red only when the room stays above the limit for a second.</text>
  </g>
</svg>
