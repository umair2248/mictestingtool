<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">Mouse double click test: one click on the left button registered as two clicks a few milliseconds apart</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#141a3a"/></linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.42" r="0.5"><stop offset="0" stop-color="#4f8cff" stop-opacity="0.32"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <g font-family="Roboto, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#glow)"/>
    <text x="72" y="112" fill="#93b4ff" font-size="26" font-weight="600" letter-spacing="3">FREE ONLINE TOOL</text>
    <text x="72" y="194" fill="#ffffff" font-size="62" font-weight="700">Mouse</text>
    <text x="72" y="266" fill="#ffffff" font-size="62" font-weight="700">Double Click</text>
    <text x="72" y="338" fill="#ffffff" font-size="62" font-weight="700">Test</text>
    <text x="72" y="404" fill="#c7d2ea" font-size="25">One click registered as two?</text>
    <text x="72" y="442" fill="#c7d2ea" font-size="25">See every click in milliseconds.</text>
    <rect x="72" y="494" width="300" height="60" rx="30" fill="url(#btn)"/>
    <text x="222" y="533" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">mictestingtool.com</text>

    <g transform="translate(700 70)">
      <path d="M150 0 C235 0 270 60 270 140 V330 C270 420 215 480 135 480 C55 480 0 420 0 330 V140 C0 60 50 0 150 0 Z" fill="#0f1628" stroke="#33405e" stroke-width="5"/>
      <path d="M135 2 C60 6 3 60 3 140 V190 H135 Z" fill="url(#btn)"/>
      <path d="M135 2 C210 2 267 60 267 140 V190 H135 Z" fill="#18213a"/>
      <line x1="135" y1="0" x2="135" y2="190" stroke="#33405e" stroke-width="4"/>
      <line x1="3" y1="190" x2="267" y2="190" stroke="#33405e" stroke-width="4"/>
      <rect x="121" y="56" width="28" height="64" rx="14" fill="#0f1628" stroke="#33405e" stroke-width="4"/>
      <circle cx="70" cy="96" r="70" fill="none" stroke="#f87171" stroke-width="4" stroke-dasharray="8 8"/>
    </g>
    <g transform="translate(905 395)">
      <rect width="250" height="150" rx="18" fill="#0b1120" stroke="#33405e" stroke-width="2"/>
      <text x="22" y="40" fill="#93a3c4" font-size="17">Left · 642 ms</text>
      <rect x="10" y="58" width="230" height="40" rx="10" fill="#3a1820"/>
      <text x="22" y="85" fill="#ffffff" font-size="17" font-weight="700">Left · 9 ms</text>
      <text x="228" y="85" fill="#f87171" font-size="15" font-weight="700" text-anchor="end">double!</text>
      <text x="22" y="130" fill="#93a3c4" font-size="17">Left · 815 ms</text>
    </g>
  </g>
</svg>
