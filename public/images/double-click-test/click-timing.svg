<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Mouse double click test timing: a normal click compared with a faulty click where one press sends two clicks a few milliseconds apart</title>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
  <g font-family="Roboto, Segoe UI, system-ui, Arial, sans-serif">
    <rect width="1200" height="675" fill="#0b1020"/>
    <text x="600" y="66" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle">One press, one click… or two?</text>
    <text x="600" y="104" fill="#c7d2ea" font-size="20" text-anchor="middle">What the switch inside the button sends to the computer</text>

    <rect x="60" y="140" width="1080" height="200" rx="18" fill="#111a30" stroke="#34d399" stroke-width="2"/>
    <circle cx="104" cy="184" r="16" fill="#34d399"/><path d="M96 184 l6 6 l11 -12" stroke="#0b1020" stroke-width="3.5" fill="none"/>
    <text x="134" y="192" fill="#ffffff" font-size="22" font-weight="700">Healthy switch</text>
    <text x="1110" y="192" fill="#34d399" font-size="18" font-weight="700" text-anchor="end">1 click</text>
    <line x1="110" y1="300" x2="1090" y2="300" stroke="#33405e" stroke-width="2"/>
    <path d="M110 300 H300 V230 H560 V300 H1090" stroke="#34d399" stroke-width="5" fill="none" stroke-linejoin="round"/>
    <text x="430" y="220" fill="#c7d2ea" font-size="17" text-anchor="middle">pressed</text>
    <text x="300" y="328" fill="#7f8db0" font-size="15" text-anchor="middle">press</text>
    <text x="560" y="328" fill="#7f8db0" font-size="15" text-anchor="middle">release</text>

    <rect x="60" y="370" width="1080" height="200" rx="18" fill="#1d1222" stroke="#f87171" stroke-width="2"/>
    <circle cx="104" cy="414" r="16" fill="#f87171"/><path d="M97 407 l14 14 M111 407 l-14 14" stroke="#0b1020" stroke-width="3.5"/>
    <text x="134" y="422" fill="#ffffff" font-size="22" font-weight="700">Worn switch</text>
    <text x="1110" y="422" fill="#f87171" font-size="18" font-weight="700" text-anchor="end">2 clicks</text>
    <line x1="110" y1="530" x2="1090" y2="530" stroke="#33405e" stroke-width="2"/>
    <path d="M110 530 H300 V460 H330 V530 H352 V460 H560 V530 H1090" stroke="#f87171" stroke-width="5" fill="none" stroke-linejoin="round"/>
    <path d="M330 486 H352" stroke="#ffffff" stroke-width="2"/>
    <line x1="330" y1="476" x2="330" y2="496" stroke="#ffffff" stroke-width="2"/><line x1="352" y1="476" x2="352" y2="496" stroke="#ffffff" stroke-width="2"/>
    <rect x="372" y="470" width="190" height="34" rx="10" fill="#3a1820"/>
    <text x="467" y="493" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">bounce: 5–50 ms</text>
    <text x="300" y="558" fill="#7f8db0" font-size="15" text-anchor="middle">press</text>
    <text x="560" y="558" fill="#7f8db0" font-size="15" text-anchor="middle">release</text>

    <text x="600" y="624" fill="#c7d2ea" font-size="19" text-anchor="middle">People can’t double click faster than about 100 ms. The test flags anything under 80 ms.</text>
  </g>
</svg>
